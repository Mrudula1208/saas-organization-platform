<div class="logout-page-container">
  <div class="glass-card logout-box glow-secondary animate-slide-up">
    <div class="logout-icon">
      <span class="material-symbols-outlined">logout</span>
    </div>
    <h2>Confirm Logout</h2>
    <p>Are you sure you want to end your session? You will need to enter your credentials again to log back in.</p>
    <div class="logout-actions">
      <button class="btn btn-outline" (click)="cancel()">Cancel</button>
      <button class="btn btn-danger" (click)="confirmLogout()">Logout</button>
    </div>
  </div>
</div>
