[build]
  base = "frontend/saas-platform-angular"
  publish = "dist/saas-platform-angular/browser"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "http://saasplatform-backend.somee.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
